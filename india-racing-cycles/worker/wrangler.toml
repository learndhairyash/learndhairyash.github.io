name = "india-racing-cycles-api"
main = "src/index.js"
compatibility_date = "2026-11-04"

# Create a Cloudflare D1 database and replace the placeholder below before deploying.
[[d1_databases]]
binding = "DB"
database_name = "india-racing-cycles"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"

[vars]
# Set this to the exact GitHub Pages origin, not a wildcard.
SITE_URL = "https://learndhairyash.github.io"