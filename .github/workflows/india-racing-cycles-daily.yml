name: India Racing Cycles — daily research

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: india-racing-cycles-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: india-racing-cycles/automation/requirements.txt
      - name: Install collector dependencies
        run: pip install -r india-racing-cycles/automation/requirements.txt
      - name: Research public cycling sources
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python india-racing-cycles/automation/agent.py
      - name: Publish updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add india-racing-cycles/data/events.json india-racing-cycles/data/news.json india-racing-cycles/data/review-queue.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(irc): daily cycling calendar and news refresh"
            git push
          else
            echo "No data changes to publish."
          fi